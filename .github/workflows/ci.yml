name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  actionlint:
    name: Lint workflows
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: actionlint
        uses: reviewdog/action-actionlint@6fb7acc99f4a1008869fa8a0f09cfca740837d9d # v1.72.0
        with:
          fail_level: warning
          reporter: github-check

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.13

      - name: Install dependencies
        # --ignore-scripts blocks supply-chain payloads delivered via npm
        # lifecycle hooks (preinstall/postinstall/prepare). Playwright is
        # installed via its own explicit step below.
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Install Playwright Chromium
        run: bun run --cwd packages/l402 playwright install --with-deps chromium

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      - name: Browser import
        run: bun run test:browser --filter @boltwall/l402

      - name: Build
        run: bun run build

      - name: Bundle secret audit
        working-directory: apps/playground
        run: bun run scripts/audit-bundle.ts

      - name: Bundle secret audit self-test
        working-directory: apps/playground
        run: bun run scripts/audit-bundle.ts --self-test

      - name: Lighthouse a11y
        working-directory: apps/playground
        run: bunx @lhci/cli autorun
        env:
          LHCI_BUILD_CONTEXT__CURRENT_HASH: ${{ github.sha }}

  package-health:
    name: Package health
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.13

      - name: Install dependencies
        # --ignore-scripts blocks supply-chain payloads delivered via npm
        # lifecycle hooks (preinstall/postinstall/prepare).
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Build
        # publint/attw inspect the published artifacts; attw packs dist via
        # `bun pm pack`, so dist/ must exist first.
        run: bun run build

      - name: Package health (publint + arethetypeswrong)
        # Reported but non-blocking: publint/attw findings show up in the logs
        # without failing the build. Remove continue-on-error to make this a
        # required check once the published API is stable.
        run: bun run package-health
        continue-on-error: true

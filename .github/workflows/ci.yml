name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright Chromium
        run: bunx playwright install --with-deps chromium

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      - name: Browser import
        run: bun run test:browser --filter @boltwall/l402

      - name: Build
        run: bun run build

      - name: Bundle secret audit
        working-directory: apps/playground
        run: bun run scripts/audit-bundle.ts

      - name: Bundle secret audit self-test
        working-directory: apps/playground
        run: bun run scripts/audit-bundle.ts --self-test

name: Aperture Interop

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  aperture-interop:
    name: Aperture Interop
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.13

      - name: Install dependencies
        # --ignore-scripts blocks supply-chain payloads delivered via npm
        # lifecycle hooks (preinstall/postinstall/prepare).
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Build @boltwall/l402
        run: bun run build --filter @boltwall/l402

      - name: Prepare LND regtest credentials
        run: |
          bun run bootstrap -- --nodes aperture-payer,aperture-server

          LND_APERTURE_DIR="$RUNNER_TEMP/boltwall-aperture-lnd"
          LND_MACAROON_DIR="$LND_APERTURE_DIR/macaroons"
          mkdir -p "$LND_MACAROON_DIR"

          docker compose \
            -f packages/adapters/src/lnd/docker-compose.smoke.yml \
            cp lnd-alice:/root/.lnd/tls.cert "$LND_APERTURE_DIR/tls.cert"
          docker compose \
            -f packages/adapters/src/lnd/docker-compose.smoke.yml \
            cp lnd-alice:/root/.lnd/data/chain/bitcoin/regtest/admin.macaroon "$LND_MACAROON_DIR/admin.macaroon"

          {
            echo "APERTURE_HOST_PORT=18081"
            echo "APERTURE_URL=http://localhost:18081"
            echo "LND_TLS_CERT_PATH=$LND_APERTURE_DIR/tls.cert"
            echo "LND_MACAROON_DIR=$LND_MACAROON_DIR"
          } >> "$GITHUB_ENV"

      - name: Start Aperture stack
        run: |
          docker compose \
            -f packages/test-fixtures/aperture-smoke/docker-compose.yml \
            up -d --build

      - name: Wait for Aperture to be ready
        run: |
          bash packages/test-fixtures/aperture-smoke/run-interop.sh --wait-only

      - name: Run interop tests
        working-directory: packages/l402
        run: bun run test:interop

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: aperture-interop-artifacts
          path: |
            packages/test-fixtures/aperture-smoke/captured/**
            packages/test-fixtures/aperture-smoke/logs/**
          if-no-files-found: ignore

      - name: Tear down
        if: always()
        run: |
          docker compose \
            -f packages/test-fixtures/aperture-smoke/docker-compose.yml \
            down --volumes
          docker compose \
            -f packages/adapters/src/lnd/docker-compose.smoke.yml \
            down --volumes

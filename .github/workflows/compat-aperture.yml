name: Aperture Interop

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  aperture-interop-fork-notice:
    name: Aperture Interop fork notice
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Explain skipped interop
        run: |
          echo "Aperture interop uses repository LND regtest secrets, which are not exposed to fork pull requests."
          echo "A maintainer can run this workflow with workflow_dispatch after reviewing the fork changes."

  aperture-interop:
    name: Aperture Interop
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.13

      - name: Install dependencies
        # --ignore-scripts blocks supply-chain payloads delivered via npm
        # lifecycle hooks (preinstall/postinstall/prepare).
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Build @boltwall/l402
        run: bun run build --filter @boltwall/l402

      - name: Verify Aperture secrets
        env:
          LND_TLS_CERT_PATH: ${{ secrets.LND_TLS_CERT_PATH }}
          LND_MACAROON_DIR: ${{ secrets.LND_MACAROON_DIR }}
        run: |
          test -n "$LND_TLS_CERT_PATH" || { echo "::error::LND_TLS_CERT_PATH repository secret is required for same-repo Aperture interop."; exit 1; }
          test -n "$LND_MACAROON_DIR" || { echo "::error::LND_MACAROON_DIR repository secret is required for same-repo Aperture interop."; exit 1; }

      - name: Start Aperture stack
        env:
          LND_TLS_CERT_PATH: ${{ secrets.LND_TLS_CERT_PATH }}
          LND_MACAROON_DIR: ${{ secrets.LND_MACAROON_DIR }}
        run: |
          docker compose \
            -f packages/test-fixtures/aperture-smoke/docker-compose.yml \
            up -d --build

      - name: Wait for Aperture to be ready
        run: |
          bash packages/test-fixtures/aperture-smoke/run-interop.sh --wait-only

      - name: Run interop tests
        working-directory: packages/l402
        env:
          APERTURE_URL: "http://localhost:8081"
        run: bun run test:interop

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: aperture-interop-artifacts
          path: |
            packages/test-fixtures/aperture-smoke/captured/**
            packages/test-fixtures/aperture-smoke/logs/**
          if-no-files-found: ignore

      - name: Tear down
        if: always()
        run: |
          docker compose \
            -f packages/test-fixtures/aperture-smoke/docker-compose.yml \
            down --volumes

name: Docs

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build API docs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.13

      - name: Install dependencies
        # --ignore-scripts blocks supply-chain payloads delivered via npm
        # lifecycle hooks (preinstall/postinstall/prepare).
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Build packages
        # TypeDoc resolves workspace imports (e.g. @boltwall/internal) through
        # each package's built types, so the dist outputs must exist first.
        run: bun run build

      - name: Generate API docs
        # typedoc runs with treatWarningsAsErrors, so this step is also the CI
        # check that the generated reference builds without warnings or errors.
        run: bun run docs:api

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs-site
          # v4+ excludes dotfiles by default; the TypeDoc site ships .nojekyll,
          # without which Pages runs Jekyll and drops underscore-prefixed assets.
          include-hidden-files: true

  deploy:
    name: Deploy to GitHub Pages
    # Pull requests build the docs as a check; only main deploys to Pages.
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      # Required by GitHub Pages custom workflows for the deploy-pages OIDC token:
      # https://docs.github.com/pages/getting-started-with-github-pages/using-custom-workflows-with-github-pages
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0

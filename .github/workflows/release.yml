name: Release Readiness

# Triggered on every merge to main.
#
# Behaviour:
# - Runs the release quality gates on main.
# - Does NOT run Changesets versioning or npm publishing while pre-stable.
# - Phase 9 bead bw-j5u.5 owns re-enabling Changesets release PRs,
#   npm publishing, and provenance after the owner declares v0.1.0-stable.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    name: Release readiness
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history required for Changesets to compute correct versions.
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Install dependencies
        # --ignore-scripts blocks supply-chain payloads delivered via npm
        # lifecycle hooks. Playwright is installed via its own explicit step.
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Install Playwright Chromium
        run: bun run --cwd packages/l402 playwright install --with-deps chromium

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      - name: Browser import
        run: bun run test:browser --filter @boltwall/l402

      - name: Build
        run: bun run build

      - name: Package health
        run: bun run package-health

      - name: Publishing disabled pre-stable
        run: |
          echo "Changesets versioning and npm publishing are intentionally disabled before Phase 9."
          echo "Re-enable them in bw-j5u.5 after the owner declares v0.1.0-stable."

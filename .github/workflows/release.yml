name: Release

# Triggered on every merge to main.
#
# Behaviour:
# - If unpublished changesets exist, Changesets action opens/updates a
#   "Version Packages" release PR.
# - When that release PR is merged (and all quality gates below pass),
#   the action publishes to npm — but ONLY if NPM_TOKEN is set in
#   GitHub secrets.
#
# Pre-Phase-9 (before bw-9zp.6 owner stability gate):
#   Do NOT set NPM_TOKEN in repository secrets. The workflow will run
#   the quality gates and create release PRs, but the publish step
#   will skip with a logged message.  This is the intended safe state.
#
# Post-Phase-9 (after owner declares v0.1.0-stable):
#   Add NPM_TOKEN (and optionally NPM_CONFIG_PROVENANCE=true for npm
#   provenance attestations) as repository secrets to enable real publish.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write       # push version commits and tags
  pull-requests: write  # create/update release PRs
  id-token: write       # npm provenance attestation (OIDC)

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history required for Changesets to compute correct versions.
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright Chromium
        run: bunx playwright install --with-deps chromium

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      - name: Browser import
        run: bun run test:browser --filter @boltwall/l402

      - name: Build
        run: bun run build

      - name: Package health
        run: bun run package-health

      - name: Create Release PR or Publish
        uses: changesets/action@v1
        with:
          # Bumps versions and updates changelogs inside the release PR.
          version: bun run version-packages
          # Publishes to npm after the release PR is merged.
          # Skips gracefully if NPM_TOKEN is not set (pre-Phase-9 safe state).
          publish: bun run release
          title: "chore: version packages"
          commit: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # NPM_TOKEN must NOT be set before the bw-9zp.6 owner stability
          # gate. Once set, real npm publishes happen on every release PR merge.
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          # Enable npm provenance attestations when publishing post-Phase-9.
          NPM_CONFIG_PROVENANCE: "true"

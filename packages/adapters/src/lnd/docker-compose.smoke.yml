services:
  bitcoind:
    image: ruimarinho/bitcoin-core:24
    command:
      - -regtest=1
      - -server=1
      - -txindex=1
      - -fallbackfee=0.0002
      - -rpcuser=devuser
      - -rpcpassword=devpass
      - -rpcallowip=0.0.0.0/0
      - -rpcbind=0.0.0.0
      - -zmqpubrawblock=tcp://0.0.0.0:28332
      - -zmqpubrawtx=tcp://0.0.0.0:28333
    ports:
      - "18443:18443"
    volumes:
      - btc-data:/home/bitcoin/.bitcoin

  lnd-alice:
    image: lightninglabs/lnd:v0.18.5-beta
    entrypoint:
      - /bin/sh
      - -c
    environment:
      LND_WALLET_PASSWORD: boltwall-regtest-dev-password
    command:
      - |
        set -eu
        printf '%s\n' "$$LND_WALLET_PASSWORD" > /tmp/lnd-wallet-password
        chmod 600 /tmp/lnd-wallet-password
        exec lnd \
          --wallet-unlock-password-file=/tmp/lnd-wallet-password \
          --wallet-unlock-allow-create \
          --trickledelay=5000 \
          --bitcoin.active \
          --bitcoin.regtest \
          --bitcoin.node=bitcoind \
          --bitcoind.rpchost=bitcoind \
          --bitcoind.rpcuser=devuser \
          --bitcoind.rpcpass=devpass \
          --bitcoind.zmqpubrawblock=tcp://bitcoind:28332 \
          --bitcoind.zmqpubrawtx=tcp://bitcoind:28333 \
          --rpclisten=0.0.0.0:10009 \
          --restlisten=0.0.0.0:8080 \
          --listen=0.0.0.0:9735 \
          --alias=alice \
          --externalip=lnd-alice:9735
    depends_on:
      - bitcoind
    ports:
      - "10009:10009"
      - "8080:8080"
      - "9735:9735"
    volumes:
      - alice-data:/root/.lnd

  lnd-bob:
    image: lightninglabs/lnd:v0.18.5-beta
    entrypoint:
      - /bin/sh
      - -c
    environment:
      LND_WALLET_PASSWORD: boltwall-regtest-dev-password
    command:
      - |
        set -eu
        printf '%s\n' "$$LND_WALLET_PASSWORD" > /tmp/lnd-wallet-password
        chmod 600 /tmp/lnd-wallet-password
        exec lnd \
          --wallet-unlock-password-file=/tmp/lnd-wallet-password \
          --wallet-unlock-allow-create \
          --trickledelay=5000 \
          --bitcoin.active \
          --bitcoin.regtest \
          --bitcoin.node=bitcoind \
          --bitcoind.rpchost=bitcoind \
          --bitcoind.rpcuser=devuser \
          --bitcoind.rpcpass=devpass \
          --bitcoind.zmqpubrawblock=tcp://bitcoind:28332 \
          --bitcoind.zmqpubrawtx=tcp://bitcoind:28333 \
          --rpclisten=0.0.0.0:10009 \
          --restlisten=0.0.0.0:8080 \
          --listen=0.0.0.0:9735 \
          --alias=bob \
          --externalip=lnd-bob:9735
    depends_on:
      - bitcoind
    ports:
      - "10010:10009"
      - "8081:8080"
      - "9736:9735"
    volumes:
      - bob-data:/root/.lnd

volumes:
  btc-data:
  alice-data:
  bob-data:

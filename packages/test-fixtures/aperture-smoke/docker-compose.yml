services:
  backend:
    image: node:22-alpine
    command:
      - node
      - -e
      - >
        require("node:http").createServer((req, res) => {
          res.writeHead(200, {"content-type": "application/json"});
          res.end(JSON.stringify({ok: true, url: req.url}));
        }).listen(18080, "0.0.0.0");
    ports:
      - "18080:18080"

  aperture:
    build:
      context: ${APERTURE_SOURCE:-https://github.com/lightninglabs/aperture.git#master}
    depends_on:
      - backend
    volumes:
      - ./aperture.yaml:/root/.aperture/aperture.yaml:ro
      - ${LND_TLS_CERT_PATH:?set LND_TLS_CERT_PATH to your regtest lnd tls.cert}:/lnd/tls.cert:ro
      - ${LND_MACAROON_DIR:?set LND_MACAROON_DIR to your regtest lnd macaroon dir}:/lnd/macaroons:ro
      - aperture-data:/root/.aperture/data
    ports:
      - "8081:8081"

volumes:
  aperture-data:
